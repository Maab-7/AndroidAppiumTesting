name: Android Appium Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    runs-on: macos-latest
    
    permissions:
      checks: write
      pull-requests: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5.2.0
        with:
          python-version: "3.11"

      - name: Install Node.js
        uses: actions/setup-node@v4.1.0
        with:
          node-version: "24"

      - name: Install Appium and dependencies
        run: |
          npm install -g appium
          appium driver install uiautomator2

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          
      - name: Start Android Emulator
        run: |
          echo "Starting emulator..."
          $ANDROID_HOME/emulator/emulator -avd Pixel_6_API_33 -no-snapshot-load -no-window -gpu swiftshader_indirect -memory 2048 -cores 2 &
          sleep 45
          adb wait-for-device
          adb shell getprop ro.build.version.release

      - name: Start Appium Server
        run: |
          appium --port 4723 &
          sleep 5

      - name: Run Android Appium Tests
        run: |
          pytest tests/test_apidemos.py -v --alluredir=allure-results --junitxml=test-results.xml
        continue-on-error: true

      - name: Upload Allure results
        uses: actions/upload-artifact@v4.4.3
        if: always()
        with:
          name: allure-results
          path: allure-results/
          retention-days: 30

      - name: Upload JUnit results
        uses: actions/upload-artifact@v4.4.3
        if: always()
        with:
          name: test-results
          path: test-results.xml
          retention-days: 30

      - name: Publish test results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          files: test-results.xml
          check_name: "Android Appium Test Results"

      - name: Generate Allure Report
        if: always()
        uses: simple-elf/allure-report-action@master
        with:
          allure_results: allure-results
          allure_history: allure-history
          keep_reports: 20

      - name: Deploy report to GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: allure-report

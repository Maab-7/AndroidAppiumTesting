name: Android Tests - Appium

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: "0 2 * * *"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    runs-on: macos-latest
    timeout-minutes: 45

    permissions:
      checks: write
      pull-requests: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install Appium and dependencies
        run: |
          npm install -g appium
          appium driver install uiautomator2

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 33
          target: google_apis
          arch: x86_64

      - name: Start Android Emulator
        run: |
          echo "Starting emulator..."
          $ANDROID_HOME/emulator/emulator -avd Pixel_6_API_33 -no-snapshot-load -no-window -gpu swiftshader_indirect -memory 2048 -cores 2 &
          sleep 45
          adb wait-for-device
          adb shell getprop ro.build.version.release

      - name: Start Appium Server
        run: |
          appium --port 4723 &
          sleep 5

      - name: Run Android Tests
        run: |
          pytest tests/ -v \
            --alluredir=allure-results \
            --junitxml=test-results.xml \
            --html=report.html \
            --self-contained-html \
            --tb=short
        continue-on-error: true

      - name: Upload test report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-report-html
          path: report.html
          retention-days: 30

      - name: Upload Allure results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-results
          path: allure-results/
          retention-days: 30

      - name: Upload JUnit XML
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-results
          path: test-results.xml
          retention-days: 30

      - name: Test Summary
        if: always()
        run: |
          echo "✅ Android Test Suite Completed"
          echo "📊 Reports available in artifacts"
